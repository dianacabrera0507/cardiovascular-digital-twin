[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiovascular-digital-twin"
version = "0.1.0"
description = "Research scaffold for patient-specific cardiovascular dynamic modeling"
requires-python = ">=3.10"
authors = [
  {name = "Diana Cabrera"},
  {name = "Luna"}
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
